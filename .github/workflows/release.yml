name: release
# Kanal rilis resmi. Memicu: push tag.
#   v1.2.3          → GitHub Release STABIL (bukan prerelease)
#   v1.2.3-dev.1    → GitHub Release DEV (prerelease)
# Policy lengkap: README §"Status & kanal rilis" + CHANGELOG.md.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$GITHUB_WORKSPACE/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build release APK (ditandatangani keystore repo)
        run: gradle assembleRelease --no-daemon

      - name: Tentukan kanal (stabil vs dev) dari nama tag
        id: chan
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == *"-dev"* ]]; then
            echo "prerelease=true"  >> "$GITHUB_OUTPUT"
            echo "title=$TAG (dev)" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "title=$TAG"       >> "$GITHUB_OUTPUT"
          fi

      - name: Ambil catatan rilis dari CHANGELOG.md
        id: notes
        run: |
          BASE="${GITHUB_REF_NAME#v}"; BASE="${BASE%%-dev*}"
          awk -v sec="## [$BASE" '
            index($0, sec)==1 {grab=1; next}
            grab && /^## \[/ {exit}
            grab {print}
          ' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || printf 'Lihat CHANGELOG.md untuk %s\n' "$GITHUB_REF_NAME" > release-notes.md

      - name: Buat GitHub Release + lampirkan APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.chan.outputs.title }}
          prerelease: ${{ steps.chan.outputs.prerelease }}
          body_path: release-notes.md
          files: app/build/outputs/apk/release/*.apk
