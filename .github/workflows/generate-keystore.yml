name: generate-keystore

# One-off: produces a release keystore committed to the repo so the APK
# signature is STABLE across builds (no more INSTALL_FAILED_UPDATE_INCOMPATIBLE
# / forced uninstall on the test device). Trigger manually, download the
# artifact, commit it, then wire signingConfig in app/build.gradle.kts.
on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Generate release keystore
        run: |
          mkdir -p keystore
          keytool -genkeypair -v \
            -keystore keystore/gososmed-release.jks \
            -alias gososmed \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass gososmed123 \
            -keypass gososmed123 \
            -dname "CN=GoSosmed Agent, OU=BYOD, O=GoSosmed, L=ID, C=ID"
      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: gososmed-keystore
          path: keystore/gososmed-release.jks
