name: build-apk
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest sudah punya Android SDK; hanya perlu accept licenses
      # dan install platform/build-tools yang dibutuhkan.
      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Cache Android debug keystore (stable APK signature)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Setup Gradle 8.9 (cached, action resmi — stabil, tanpa wget manual)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # P1-1 (Plan 07): unit test JVM pertama — CI merah bila test gagal,
      # sebelum APK dibangun (fail-fast).
      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gososmed-agent-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
